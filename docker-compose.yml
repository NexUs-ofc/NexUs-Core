services:
  nexus-core:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-core:local
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    environment:
      PORT: ${PORT:-8080}
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE}
      JWT_SECRET_BASE64: ${JWT_SECRET_BASE64}
      JWT_ISSUER: ${JWT_ISSUER:-nexus-auth}
      GEOCODING_USER_AGENT: ${GEOCODING_USER_AGENT:-NexUs-Core/1.0}
    restart: unless-stopped
