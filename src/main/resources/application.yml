spring:
  config:
    import: optional:file:src/main/resources/.env.properties
  application:
    name: NexUs-Core
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.boot.allow_jdbc_metadata_access: false
  mongodb:
    uri: ${MONGODB_URI}
    database: ${MONGODB_DATABASE}
  web:
    error:
      include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  health:
    mongodb:
      enabled: false

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  auth:
    issuer: ${JWT_ISSUER:nexus-auth}
    jwt-secret-base64: ${JWT_SECRET_BASE64}
  geocoding:
    user-agent: '${GEOCODING_USER_AGENT:NexUs-Core/1.0 (contato: suporte@nexus.app)}'
