spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:src/main/resources/.env.properties
      - optional:file:.env.properties
  application:
    name: NexUs-Core
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.boot.allow_jdbc_metadata_access: false
  mongodb:
    uri: ${MONGODB_URI}
    database: ${MONGODB_DATABASE}
    auto-index-creation: true
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}
  web:
    error:
      include-message: never

management:
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health,prometheus
  health:
    mongodb:
      enabled: false
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        "[http.server.requests]": true
      minimum-expected-value:
        "[http.server.requests]": 5ms
      maximum-expected-value:
        "[http.server.requests]": 30s

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

app:
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  admin:
    key: ${ADMIN_API_KEY:${TRACING_ACESS:}}
    metrics:
      step-ms: ${ADMIN_METRICS_STEP_MS:60000}
      retention-minutes: ${ADMIN_METRICS_RETENTION_MINUTES:720}
  scheduling:
    zone: ${BUSINESS_TIME_ZONE:America/Sao_Paulo}
  billing:
    due-day: ${BILLING_DUE_DAY:10}
    grace-days: ${BILLING_GRACE_DAYS:0}
    monthly-payments-cron: "${BILLING_MONTHLY_PAYMENTS_CRON:0 10 0 1 * *}"
    overdue-payments-cron: "${BILLING_OVERDUE_PAYMENTS_CRON:0 15 0 * * *}"
  profile:
    dietary-restrictions-cache-ttl-seconds: ${PROFILE_DIETARY_RESTRICTIONS_CACHE_TTL_SECONDS:86400}
  auth:
    issuer: ${JWT_ISSUER:nexus-auth}
    jwt-secret-base64: ${JWT_SECRET_BASE64}
  geocoding:
    user-agent: '${GEOCODING_USER_AGENT:NexUs-Core/1.0 (contato: suporte@nexus.app)}'

notify:
  integration:
    token: ${NOTIFY_CORE_TOKEN:}
