spring:
  config:
    import: optional:file:src/main/resources/.env.properties
  application:
    name: NexUs-Core
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  data:
    mongodb:
      uri: ${MONGODB_URI}
      database: ${MONGODB_DATABASE}
  management:
    endpoints:
      web:
        exposure:
          include: health

server:
  port: ${PORT:8080}
  error:
    include-message: never

app:
  auth:
    issuer: ${JWT_ISSUER:nexus-auth}
    jwt-secret-base64: ${JWT_SECRET_BASE64}
