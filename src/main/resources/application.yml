spring:
  config:
    import: optional:file:src/main/resources/.env.properties
  application:
    name: NexUs-Core
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  management:
    endpoints:
      web:
        exposure:
          include: health

server:
  port: ${PORT:8080}
  error:
    include-message: never